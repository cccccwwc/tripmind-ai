services:
  - type: web
    name: tripmind-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: TripMind AI 多智能体旅行规划平台
      - key: LLM_MODEL_ID
        value: deepseek-chat
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_API_KEY
        sync: false
      - key: AMAP_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: VITE_AMAP_WEB_JS_KEY
        sync: false
      - key: VITE_AMAP_SECURITY_JS_CODE
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LANGGRAPH_CHECKPOINT_PATH
        value: /tmp/tripmind/langgraph_checkpoints.db
      - key: TRAVEL_MEMORY_DB_PATH
        value: /tmp/tripmind/travel_memory.db
      - key: TRIP_JOB_DB_PATH
        value: /tmp/tripmind/trip_jobs.db
